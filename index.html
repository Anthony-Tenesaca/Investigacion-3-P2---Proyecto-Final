<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Inteligente de Gestión de Emergencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --panel:#121B2E;
    --panel-alt:#182338;
    --line:#243149;
    --line-soft:#1A2438;
    --text:#E6EDF5;
    --text-dim:#8CA0B8;
    --text-faint:#546279;
    --alta:#E4572E;
    --alta-soft:rgba(228,87,46,.14);
    --media:#E8B93E;
    --media-soft:rgba(232,185,62,.14);
    --baja:#3FA796;
    --baja-soft:rgba(63,167,150,.14);
    --ocupada:#4A5A75;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button, select, input{font-family:inherit;}

  .shell{
    display:grid;
    grid-template-columns:84px 1fr;
    grid-template-rows:60px auto 1fr;
    grid-template-areas:
      "rail header"
      "rail map"
      "rail panel";
    height:100vh;
    min-height:600px;
  }

  /* ---------- RAIL ---------- */
  .rail{
    grid-area:rail;
    background:#0A0F1B;
    border-right:1px solid var(--line-soft);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:10px 0;
    overflow-y:auto;
  }
  .rail-btn{
    background:none;
    border:none;
    border-left:3px solid transparent;
    color:var(--text-faint);
    padding:10px 4px 12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .rail-btn:hover{ background:var(--panel-alt); color:var(--text-dim); }
  .rail-btn.active{
    color:var(--text);
    border-left-color:var(--alta);
    background:var(--panel-alt);
  }
  .rail-num{ font-family:'JetBrains Mono',monospace; font-size:11px; opacity:.8; }
  .rail-label{ font-size:9.5px; line-height:1.15; text-align:center; text-transform:uppercase; letter-spacing:.03em; max-width:70px; }

  /* ---------- HEADER ---------- */
  .header{
    grid-area:header;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,#0D1526,#0B1220);
  }
  .header h1{ font-size:17px; margin:0; letter-spacing:.06em; }
  .header .sub{ color:var(--text-faint); font-size:11px; margin-left:10px; font-weight:500; font-family:'Inter'; }
  .header-right{ display:flex; align-items:center; gap:14px; }
  .clock{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); }
  .chips{ display:flex; gap:6px; }
  .chip{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:4px 8px;
    border-radius:6px;
    background:var(--panel-alt);
    color:var(--text-dim);
    border:1px solid var(--line-soft);
    white-space:nowrap;
  }
  .chip b{ color:var(--text); font-weight:600; }

  /* ---------- MAP ---------- */
  .map-wrap{
    grid-area:map;
    border-bottom:1px solid var(--line-soft);
    background:var(--panel);
    display:flex;
    gap:14px;
    padding:12px 20px;
    align-items:stretch;
  }
  .map-svg-box{ position:relative; flex:0 0 auto; }
  .sweep{
    position:absolute; inset:0;
    border-radius:50%;
    pointer-events:none;
    animation:spin 9s linear infinite;
    mix-blend-mode:screen;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .map-legend{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
    font-size:11px;
    color:var(--text-dim);
    min-width:170px;
  }
  .legend-row{ display:flex; align-items:center; gap:7px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .legend-note{ color:var(--text-faint); font-size:10.5px; margin-top:6px; line-height:1.4; }

  /* ---------- PANEL ---------- */
  .panel{
    grid-area:panel;
    overflow-y:auto;
    padding:20px 24px 60px;
  }
  .module{ display:none; max-width:980px; }
  .module.active{ display:block; }
  .module h2{ font-size:20px; margin:0 0 4px; }
  .module .desc{ color:var(--text-dim); font-size:12.5px; margin:0 0 18px; }

  .card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:14px;
  }
  .card h3{ font-size:13px; margin:0 0 12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; font-family:'Inter'; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:12px; color:var(--text-dim); }
  .field input, .field select{
    background:var(--panel-alt);
    border:1px solid var(--line-soft);
    color:var(--text);
    padding:8px 10px;
    border-radius:6px;
    font-size:13.5px;
    outline:none;
  }
  .field input:focus, .field select:focus, button:focus-visible{ border-color:var(--baja); box-shadow:0 0 0 2px rgba(63,167,150,.25); }
  .field .hint{ font-size:10.5px; color:var(--text-faint); }
  .checkline{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .checkline input{ width:16px; height:16px; accent-color:var(--baja); }
  .checkline label{ font-size:13px; color:var(--text); }

  .btn{
    background:var(--baja);
    color:#06110E;
    border:none;
    padding:9px 16px;
    border-radius:7px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.secondary{ background:var(--panel-alt); color:var(--text); border:1px solid var(--line-soft); }
  .btn.warn{ background:var(--alta); color:#1a0a05; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; font-family:'JetBrains Mono',monospace; }
  .badge.alta{ background:var(--alta-soft); color:var(--alta); }
  .badge.media{ background:var(--media-soft); color:var(--media); }
  .badge.baja{ background:var(--baja-soft); color:var(--baja); }
  .badge.estado-desp{ background:rgba(140,160,184,.15); color:var(--text-dim); }
  .badge.estado-aten{ background:var(--media-soft); color:var(--media); }
  .badge.estado-fin{ background:var(--baja-soft); color:var(--baja); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:6px 10px; border-bottom:1px solid var(--line-soft); font-weight:600; }
  td{ padding:8px 10px; border-bottom:1px solid var(--line-soft); color:var(--text); }
  tr:hover td{ background:var(--panel-alt); }
  .linklike{ background:none; border:none; color:var(--baja); cursor:pointer; font-size:12px; text-decoration:underline; padding:0; }

  .empty{ color:var(--text-faint); font-size:13px; padding:20px 4px; }

  .unit-grid{ display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin-bottom:6px; }
  .unit-box{
    aspect-ratio:1;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    border:1px solid var(--line-soft);
  }
  .unit-box.libre{ background:var(--baja-soft); color:var(--baja); }
  .unit-box.ocupada{ background:rgba(74,90,117,.35); color:var(--text-dim); }

  .barrow{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px; }
  .barrow .lbl{ width:90px; flex:0 0 auto; color:var(--text-dim); }
  .bartrack{ flex:1; height:8px; background:var(--panel-alt); border-radius:4px; overflow:hidden; }
  .barfill{ height:100%; border-radius:4px; }
  .barrow .val{ width:60px; text-align:right; font-family:'JetBrains Mono',monospace; color:var(--text); flex:0 0 auto; }

  .kv{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line-soft); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--text-dim); }
  .kv .v{ font-family:'JetBrains Mono',monospace; color:var(--text); }

  .alert-box{ padding:10px 12px; border-radius:8px; font-size:12.5px; margin-bottom:10px; }
  .alert-box.warn{ background:var(--alta-soft); color:var(--alta); border:1px solid rgba(228,87,46,.3); }
  .alert-box.info{ background:var(--baja-soft); color:var(--baja); border:1px solid rgba(63,167,150,.3); }

  .truth-table{ margin-bottom:20px; }
  .truth-table .rule{ font-size:12.5px; color:var(--text-dim); margin-bottom:8px; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:820px){
    .shell{ grid-template-columns:64px 1fr; }
    .rail-label{ display:none; }
    .grid2{ grid-template-columns:1fr; }
    .map-wrap{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="rail" id="rail"></nav>

  <header class="header">
    <div style="display:flex;align-items:baseline;">
      <h1>CENTRO DE DESPACHO</h1>
      <span class="sub">Sistema Inteligente de Gestión de Emergencias</span>
    </div>
    <div class="header-right">
      <div class="chips" id="chips"></div>
      <div class="clock mono" id="clock">00:00:00</div>
    </div>
  </header>

  <div class="map-wrap">
    <div class="map-svg-box">
      <svg id="mapa" width="360" height="230" viewBox="0 0 360 230"></svg>
    </div>
    <div class="map-legend">
      <div class="legend-row"><span class="dot" style="background:var(--alta)"></span> Prioridad Alta</div>
      <div class="legend-row"><span class="dot" style="background:var(--media)"></span> Prioridad Media</div>
      <div class="legend-row"><span class="dot" style="background:var(--baja)"></span> Prioridad Baja</div>
      <div class="legend-row"><span class="dot" style="background:var(--text-faint)"></span> Finalizada</div>
      <div class="legend-note" id="mapaNota">Mapa cartesiano (km). Las estaciones son fijas; cada emergencia se ubica según sus coordenadas.</div>
    </div>
  </div>

  <main class="panel" id="panel"></main>
</div>

<script>
(function(){

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const TIPOS = ["Incendio","Robo","Accidente"];
const ESTACIONES = [
  {id:1, nombre:"Estación Central", x:0,  y:0},
  {id:2, nombre:"Estación Norte",   x:15, y:10},
  {id:3, nombre:"Estación Sur",     x:8,  y:-12}
];

const S = {
  emergencias: [],           // lista de emergencias registradas
  bomberos: Array(10).fill(0),
  ambulancias: Array(10).fill(0),
  patrullas: Array(10).fill(0),
  contadorTipo: {Incendio:0, Robo:0, Accidente:0},
  emergenciasPorSemana: [0,0,0,0,0],
  sumaTiempoDespacho:0, sumaTiempoLlegada:0, sumaTiempoAtencion:0, sumaPrioridad:0,
  contApoyoExterno:0, contUnidadesApoyoExterno:0,
  totalBomberosUsados:0, totalAmbulanciasUsadas:0, totalPatrullasUsadas:0,
  contPrioridadAlta:0, contPrioridadMedia:0, contPrioridadBaja:0,
  contLlegadasRegistradas:0, contEmergenciasFinalizadas:0,
  pendingReg: null,          // registro calculado a la espera de confirmar tiempo de despacho
  detalleSeleccion: null
};

const RAIL_ITEMS = [
  {n:"01", label:"Nueva Emergencia"},
  {n:"02", label:"Registrar Llegada"},
  {n:"03", label:"Finalizar"},
  {n:"04", label:"Unidades"},
  {n:"05", label:"Historial"},
  {n:"06", label:"Reportes"},
  {n:"07", label:"Detalle"},
];
let activeModule = 0;

/* =========================================================
   UTILIDADES DE CÁLCULO (mismas reglas que el programa Java)
   ========================================================= */
function calcularPrioridad(riesgoVida, incendio, nivelIncendio, numHeridos){
  let p = 0;
  if (riesgoVida) p += 40;
  if (incendio){
    if (nivelIncendio === "Bajo") p += 10;
    if (nivelIncendio === "Medio") p += 20;
    if (nivelIncendio === "Alto") p += 30;
  }
  if (numHeridos > 5) p += 20;
  return p;
}
function clasificarPrioridad(p){
  if (p > 60) return "Alta";
  if (p >= 31) return "Media";
  return "Baja";
}
function nivelClass(nivel){ return nivel === "Alta" ? "alta" : nivel === "Media" ? "media" : "baja"; }
function calcularDistancia(x1,y1,x2,y2){ return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
function estacionMasCercana(x,y){
  let mejor = ESTACIONES[0], dMin = calcularDistancia(x,y,mejor.x,mejor.y);
  for (const e of ESTACIONES.slice(1)){
    const d = calcularDistancia(x,y,e.x,e.y);
    if (d < dMin){ dMin = d; mejor = e; }
  }
  return {estacion: mejor, distancia: dMin};
}
function fmt(n, dec=2){ return Number(n).toFixed(dec); }

function asignarUnidadesEmergencia(tipo, incendio, nivelIncendio, hayHeridos, numHeridos){
  let bomberosReq = 0, ambulanciasReq = 0, patrullasReq, explicacion;
  if (incendio){
    if (nivelIncendio === "Bajo") bomberosReq = 1;
    if (nivelIncendio === "Medio") bomberosReq = 3;
    if (nivelIncendio === "Alto") bomberosReq = 5;
  }
  if (hayHeridos){
    ambulanciasReq = Math.ceil(numHeridos / 4);
    patrullasReq = ambulanciasReq;
    explicacion = tipo === "Robo" ? "un robo con personas heridas" : "una emergencia con personas heridas";
  } else {
    if (tipo === "Robo"){ patrullasReq = 1; ambulanciasReq = 0; explicacion = "un robo sin personas heridas"; }
    else { ambulanciasReq = 0; patrullasReq = 1; explicacion = "un incidente sin personas heridas reportadas"; }
  }
  return {bomberosReq, ambulanciasReq, patrullasReq, explicacion};
}

function despacharUnidades(req){
  const asignados = {bomberos:[], ambulancias:[], patrullas:[]};
  let faltanBomberos = req.bomberosReq, faltanAmb = req.ambulanciasReq, faltanPat = req.patrullasReq;
  let hayFaltante = false;

  for (let i=0;i<10 && faltanBomberos>0;i++){
    if (S.bomberos[i]===0){ S.bomberos[i]=1; asignados.bomberos.push(i); faltanBomberos--; S.totalBomberosUsados++; }
  }
  if (faltanBomberos>0){ hayFaltante = true; S.contUnidadesApoyoExterno += faltanBomberos; }

  for (let i=0;i<10 && faltanAmb>0;i++){
    if (S.ambulancias[i]===0){ S.ambulancias[i]=1; asignados.ambulancias.push(i); faltanAmb--; S.totalAmbulanciasUsadas++; }
  }
  if (faltanAmb>0){ hayFaltante = true; S.contUnidadesApoyoExterno += faltanAmb; }

  for (let i=0;i<10 && faltanPat>0;i++){
    if (S.patrullas[i]===0){ S.patrullas[i]=1; asignados.patrullas.push(i); faltanPat--; S.totalPatrullasUsadas++; }
  }
  if (faltanPat>0){ hayFaltante = true; S.contUnidadesApoyoExterno += faltanPat; }

  if (hayFaltante) S.contApoyoExterno++;

  return {asignados, faltanBomberos, faltanAmb, faltanPat, hayFaltante};
}

function liberarUnidades(em){
  em.unidades.bomberos.forEach(i => S.bomberos[i] = 0);
  em.unidades.ambulancias.forEach(i => S.ambulancias[i] = 0);
  em.unidades.patrullas.forEach(i => S.patrullas[i] = 0);
}

/* =========================================================
   RAIL / NAVEGACIÓN
   ========================================================= */
function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = RAIL_ITEMS.map((it,i) => `
    <button class="rail-btn ${i===activeModule?'active':''}" data-i="${i}">
      <span class="rail-num">${it.n}</span>
      <span class="rail-label">${it.label}</span>
    </button>
  `).join("");
  rail.querySelectorAll(".rail-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeModule = Number(btn.dataset.i); renderAll(); });
  });
}

function goToDetalle(id){
  S.detalleSeleccion = id;
  activeModule = 6;
  renderAll();
}

/* =========================================================
   HEADER: reloj + chips
   ========================================================= */
function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString('es-EC',{hour12:false});
}
function renderChips(){
  const total = S.emergencias.length;
  const desp = S.emergencias.filter(e=>e.estado==="Despachada").length;
  const aten = S.emergencias.filter(e=>e.estado==="En Atención").length;
  const fin  = S.emergencias.filter(e=>e.estado==="Finalizada").length;
  document.getElementById("chips").innerHTML = `
    <span class="chip">TOTAL <b>${total}</b></span>
    <span class="chip">DESPACHADAS <b>${desp}</b></span>
    <span class="chip">EN ATENCIÓN <b>${aten}</b></span>
    <span class="chip">FINALIZADAS <b>${fin}</b></span>
  `;
}

/* =========================================================
   MAPA (SVG) — elemento distintivo del panel de situación
   ========================================================= */
function kmToSvg(x,y){
  // rango aproximado -20..20 km sobre un viewBox de 360x230
  const cx = 150, cy = 115, scale = 6.2;
  return { sx: cx + x*scale, sy: cy - y*scale };
}
function renderMapa(){
  const svg = document.getElementById("mapa");
  const cx = 150, cy = 115;
  let defs = `
    <defs>
      <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3FA796" stop-opacity="0"/>
        <stop offset="92%" stop-color="#3FA796" stop-opacity="0"/>
        <stop offset="100%" stop-color="#3FA796" stop-opacity="0.06"/>
      </radialGradient>
      <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#3FA796" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#3FA796" stop-opacity="0"/>
      </linearGradient>
    </defs>`;
  let rings = "";
  [40,75,108].forEach(r=>{
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line-soft)" stroke-width="1"/>`;
  });
  rings += `<line x1="${cx}" y1="6" x2="${cx}" y2="224" stroke="var(--line-soft)" stroke-width="1"/>`;
  rings += `<line x1="6" y1="${cy}" x2="354" y2="${cy}" stroke="var(--line-soft)" stroke-width="1"/>`;

  let sweep = `<path d="M ${cx} ${cy} L ${cx} 6 A ${cy} ${cy} 0 0 1 ${cx+ (cy*0.8)} ${cy - cy*0.55} Z" fill="url(#sweepGrad)"/>`;

  let estacionesSvg = ESTACIONES.map(e=>{
    const {sx,sy} = kmToSvg(e.x,e.y);
    return `
      <g>
        <rect x="${sx-6}" y="${sy-6}" width="12" height="12" fill="var(--panel-alt)" stroke="var(--baja)" stroke-width="1.4" transform="rotate(45 ${sx} ${sy})"/>
        <text x="${sx}" y="${sy-11}" text-anchor="middle" font-size="8.5" fill="var(--text-dim)" font-family="JetBrains Mono, monospace">${e.nombre}</text>
      </g>`;
  }).join("");

  let lineaCercana = "";
  let emergenciasSvg = S.emergencias.map(em=>{
    const {sx,sy} = kmToSvg(em.x, em.y);
    const color = em.estado==="Finalizada" ? "var(--text-faint)" : (em.nivelPrioridad==="Alta"?"var(--alta)":em.nivelPrioridad==="Media"?"var(--media)":"var(--baja)");
    const pulse = em.estado!=="Finalizada" ? `<circle cx="${sx}" cy="${sy}" r="9" fill="none" stroke="${color}" stroke-width="1" opacity="0.55"><animate attributeName="r" values="5;11" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/></circle>` : "";
    return `
      <g>
        ${pulse}
        <circle cx="${sx}" cy="${sy}" r="5" fill="${color}"/>
        <text x="${sx+8}" y="${sy+3}" font-size="8.5" fill="var(--text-dim)" font-family="JetBrains Mono, monospace">#${em.id}</text>
      </g>`;
  }).join("");

  if (S.pendingReg){
    const em = S.pendingReg;
    const {sx,sy} = kmToSvg(em.x, em.y);
    const est = kmToSvg(em.estacionCercana.x, em.estacionCercana.y);
    lineaCercana = `<line x1="${sx}" y1="${sy}" x2="${est.sx}" y2="${est.sy}" stroke="var(--baja)" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>`;
  }

  svg.innerHTML = defs + `<circle cx="${cx}" cy="${cy}" r="108" fill="url(#ringGrad)"/>` + rings + sweep + lineaCercana + estacionesSvg + emergenciasSvg;
}

/* =========================================================
   RENDER PRINCIPAL DE MÓDULOS
   ========================================================= */
function renderAll(){
  renderRail();
  renderChips();
  renderMapa();
  const panel = document.getElementById("panel");
  panel.innerHTML = MODULES[activeModule]();

}

const MODULES = [moduloNueva, moduloLlegada, moduloFinalizar, moduloUnidades, moduloHistorial, moduloReportes, moduloDetalle];

/* =========================================================
   EVENTOS DE CADA MÓDULO
   ========================================================= */
function bindModuleEvents(){
  // ---- historial -> detalle
  document.querySelectorAll("[data-detalle]").forEach(btn=>{
    btn.addEventListener("click", ()=> goToDetalle(Number(btn.dataset.detalle)));
  });

  // ---- detalle: cambiar selección
  const selDetalle = document.getElementById("selDetalle");
  if (selDetalle){
    selDetalle.addEventListener("change", ()=>{ S.detalleSeleccion = Number(selDetalle.value); renderAll(); });
  }

  // ---- módulo 01: form nueva emergencia
  const hayHeridosChk = document.getElementById("hayHeridos");
  if (hayHeridosChk){
    hayHeridosChk.addEventListener("change", ()=>{
      document.getElementById("numHeridosField").style.display = hayHeridosChk.checked ? "flex" : "none";
    });
  }
  const tipoSel = document.getElementById("tipo");
  if (tipoSel){
    const toggleIncendio = ()=>{ document.getElementById("incendioCard").style.display = tipoSel.value==="Incendio" ? "block":"none"; };
    tipoSel.addEventListener("change", toggleIncendio);
    toggleIncendio();
  }
  const formNueva = document.getElementById("formNueva");
  if (formNueva){
    formNueva.addEventListener("submit", (ev)=>{
      ev.preventDefault();
      const tipo = document.getElementById("tipo").value;
      const x = parseFloat(document.getElementById("x").value);
      const y = parseFloat(document.getElementById("y").value);
      const [horaH, horaM] = document.getElementById("hora").value.split(":").map(Number);
      const dia = Number(document.getElementById("dia").value);
      const hayHeridos = document.getElementById("hayHeridos").checked;
      const numHeridos = hayHeridos ? Number(document.getElementById("numHeridos").value) : 0;
      const riesgoVida = document.getElementById("riesgoVida").checked;
      const incendio = tipo === "Incendio";
      const nivelIncendio = incendio ? document.getElementById("nivelIncendio").value : "";

      const errs = [];
      if (isNaN(x) || isNaN(y)) errs.push("Ingresa coordenadas X e Y válidas.");
      if (!(dia>=1 && dia<=30)) errs.push("El día del mes debe estar entre 1 y 30.");
      if (hayHeridos && !(numHeridos>=1)) errs.push("Ingresa una cantidad válida de heridos.");
      if (errs.length){
        document.getElementById("errores").innerHTML = `<div class="alert-box warn">${errs.join("<br>")}</div>`;
        return;
      }

      const id = S.emergencias.length + 1;
      const puntaje = calcularPrioridad(riesgoVida, incendio, nivelIncendio, numHeridos);
      const nivelPrioridad = clasificarPrioridad(puntaje);
      const {estacion, distancia} = estacionMasCercana(x,y);
      const req = asignarUnidadesEmergencia(tipo, incendio, nivelIncendio, hayHeridos, numHeridos);
      const dispatch = despacharUnidades(req);

      const semana = Math.floor((dia-1)/7) + 1;
      S.emergenciasPorSemana[semana-1]++;
      S.contadorTipo[tipo]++;
      S.sumaPrioridad += puntaje;
      if (nivelPrioridad==="Alta") S.contPrioridadAlta++;
      if (nivelPrioridad==="Media") S.contPrioridadMedia++;
      if (nivelPrioridad==="Baja") S.contPrioridadBaja++;

      S.pendingReg = {
        id, tipo, x, y, horaH, horaM,
        horaTxt: String(horaH).padStart(2,"0")+":"+String(horaM).padStart(2,"0"),
        dia, heridos:hayHeridos, numHeridos, riesgoVida, incendio, nivelIncendio,
        puntaje, nivelPrioridad,
        estacionCercana: estacion, distanciaCercana: distancia,
        req, dispatch, explicacion: req.explicacion,
        estado: "Despachada"
      };
      renderAll();
    });
  }

  const btnConfirmar = document.getElementById("btnConfirmarRegistro");
  if (btnConfirmar){
    btnConfirmar.addEventListener("click", ()=>{
      const val = parseFloat(document.getElementById("tiempoDespachoInput").value);
      if (!(val>0)){ alert("Ingresa un tiempo de despacho válido (mayor a 0)."); return; }
      const em = S.pendingReg;
      S.sumaTiempoDespacho += val;
      S.emergencias.push({
        id: em.id, tipo: em.tipo, x: em.x, y: em.y, horaTxt: em.horaTxt, dia: em.dia,
        heridos: em.heridos, numHeridos: em.numHeridos, riesgoVida: em.riesgoVida,
        incendio: em.incendio, nivelIncendio: em.nivelIncendio,
        puntaje: em.puntaje, nivelPrioridad: em.nivelPrioridad,
        estado: "Despachada",
        tiempoDespacho: val, tiempoLlegada: 0, tiempoAtencion: 0,
        unidades: em.dispatch.asignados
      });
      S.pendingReg = null;
      renderAll();
    });
  }

  // ---- módulo 02: llegada
  const btnLlegada = document.getElementById("btnConfirmarLlegada");
  if (btnLlegada){
    btnLlegada.addEventListener("click", ()=>{
      const id = Number(document.getElementById("selLlegada").value);
      const val = parseFloat(document.getElementById("tiempoLlegadaInput").value);
      if (!(val>0)){ document.getElementById("errLlegada").innerHTML = `<div class="alert-box warn">Ingresa un tiempo válido mayor a 0.</div>`; return; }
      const em = S.emergencias.find(e=>e.id===id);
      em.tiempoLlegada = val;
      S.sumaTiempoLlegada += val;
      S.contLlegadasRegistradas++;
      em.estado = "En Atención";
      renderAll();
    });
  }

  // ---- módulo 03: finalizar
  const btnFinalizar = document.getElementById("btnConfirmarFinalizar");
  if (btnFinalizar){
    btnFinalizar.addEventListener("click", ()=>{
      const id = Number(document.getElementById("selFinalizar").value);
      const val = parseFloat(document.getElementById("tiempoAtencionInput").value);
      if (!(val>0)){ document.getElementById("errFinalizar").innerHTML = `<div class="alert-box warn">Ingresa un tiempo válido mayor a 0.</div>`; return; }
      const em = S.emergencias.find(e=>e.id===id);
      em.tiempoAtencion = val;
      S.sumaTiempoAtencion += val;
      S.contEmergenciasFinalizadas++;
      liberarUnidades(em);
      em.estado = "Finalizada";
      renderAll();
    });
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  renderAll();
  tickClock();
  setInterval(tickClock, 1000);
}
init();

})();
</script>
